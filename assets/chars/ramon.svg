<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Ramón, donkey">
  <circle cx="60" cy="60" r="58" fill="#E6E4DE"/>
  <!-- long ears -->
  <g transform="rotate(-20 40 34)">
    <ellipse cx="40" cy="30" rx="10" ry="25" fill="#8C8880" stroke="#3F3B35" stroke-width="2"/>
    <ellipse cx="40" cy="32" rx="4.5" ry="16" fill="#E7B9B5"/>
    <path d="M32 12 Q40 0 48 12" fill="#4C4842"/>
  </g>
  <g transform="rotate(20 80 34)">
    <ellipse cx="80" cy="30" rx="10" ry="25" fill="#8C8880" stroke="#3F3B35" stroke-width="2"/>
    <ellipse cx="80" cy="32" rx="4.5" ry="16" fill="#E7B9B5"/>
    <path d="M72 12 Q80 0 88 12" fill="#4C4842"/>
  </g>
  <!-- head -->
  <ellipse cx="60" cy="66" rx="27" ry="31" fill="#9D998F" stroke="#3F3B35" stroke-width="2"/>
  <!-- mane tuft -->
  <path d="M50 38 L54 28 L58 37 L62 27 L66 37 L70 30 L71 40 Q60 34 50 38 Z" fill="#4C4842"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="86" rx="21" ry="15" fill="#E4DED2" stroke="#3F3B35" stroke-width="2"/>
  <ellipse cx="52" cy="85" rx="2.6" ry="3.6" fill="#6B655B"/><ellipse cx="68" cy="85" rx="2.6" ry="3.6" fill="#6B655B"/>
  <path d="M53 94 Q60 99 67 94" fill="none" stroke="#3F3B35" stroke-width="2" stroke-linecap="round"/>
  <!-- gentle eyes -->
  <circle cx="48" cy="61" r="5" fill="#2B2A26"/><circle cx="72" cy="61" r="5" fill="#2B2A26"/>
  <circle cx="49.5" cy="62" r="1.5" fill="#fff"/><circle cx="73.5" cy="62" r="1.5" fill="#fff"/>
  <path d="M42 53 Q48 50 54 53 M66 53 Q72 50 78 53" fill="none" stroke="#3F3B35" stroke-width="2" stroke-linecap="round"/>
  <!-- yellow scallop shell on the halter -->
  <path d="M33 74 L87 74" stroke="#6B4A2B" stroke-width="3"/>
  <g transform="translate(60 74)">
    <path d="M-8 4 Q0 -12 8 4 Z" fill="#F2B705" stroke="#3F3B35" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M0 4 L0 -6 M-4 4 L-2 -5 M4 4 L2 -5" stroke="#3F3B35" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
