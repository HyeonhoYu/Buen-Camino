<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Lucía, Iberian lynx">
  <circle cx="60" cy="60" r="58" fill="#F6E7C8"/>
  <!-- ears with black tufts -->
  <path d="M30 50 L40 14 L58 40 Z" fill="#C98B43" stroke="#5A3A18" stroke-width="2" stroke-linejoin="round"/>
  <path d="M90 50 L80 14 L62 40 Z" fill="#C98B43" stroke="#5A3A18" stroke-width="2" stroke-linejoin="round"/>
  <path d="M36 42 L41 23 L50 38 Z" fill="#F1D3A8"/>
  <path d="M84 42 L79 23 L70 38 Z" fill="#F1D3A8"/>
  <path d="M40 15 L37 3 M40 15 L43 4" stroke="#1E1A16" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 15 L83 3 M80 15 L77 4" stroke="#1E1A16" stroke-width="3" stroke-linecap="round"/>
  <!-- cheek ruffs, the lynx beard -->
  <path d="M34 60 L12 84 L30 80 L18 98 L42 88 Z" fill="#EFDDBE" stroke="#5A3A18" stroke-width="2" stroke-linejoin="round"/>
  <path d="M86 60 L108 84 L90 80 L102 98 L78 88 Z" fill="#EFDDBE" stroke="#5A3A18" stroke-width="2" stroke-linejoin="round"/>
  <path d="M24 86 L34 82 M28 92 L38 87 M96 86 L86 82 M92 92 L82 87" stroke="#1E1A16" stroke-width="2" stroke-linecap="round"/>
  <!-- head -->
  <ellipse cx="60" cy="64" rx="32" ry="29" fill="#D29A55" stroke="#5A3A18" stroke-width="2"/>
  <circle cx="52" cy="44" r="2.2" fill="#7A4E22"/><circle cx="60" cy="41" r="2.2" fill="#7A4E22"/><circle cx="68" cy="44" r="2.2" fill="#7A4E22"/>
  <circle cx="40" cy="70" r="2" fill="#7A4E22"/><circle cx="80" cy="70" r="2" fill="#7A4E22"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="78" rx="15" ry="11" fill="#F7EBD8"/>
  <!-- eyes -->
  <ellipse cx="48" cy="61" rx="5" ry="6" fill="#2B2A26"/><ellipse cx="72" cy="61" rx="5" ry="6" fill="#2B2A26"/>
  <circle cx="49.8" cy="58.8" r="1.8" fill="#fff"/><circle cx="73.8" cy="58.8" r="1.8" fill="#fff"/>
  <path d="M44 66 L40 71 M76 66 L80 71" stroke="#2B2A26" stroke-width="2" stroke-linecap="round"/>
  <!-- nose and mouth -->
  <path d="M55 71 L65 71 L60 76 Z" fill="#3A2A22" stroke="#3A2A22" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M60 76 Q56 82 51 79 M60 76 Q64 82 69 79" fill="none" stroke="#3A2A22" stroke-width="2" stroke-linecap="round"/>
</svg>
